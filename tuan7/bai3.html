<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bài 3 - Giỏ hàng</title><link rel="stylesheet" href="bai3.css"><script src="https://unpkg.com/vue@3/dist/vue.global.js"></script></head>
<body><main id="app" class="container"><section class="panel"><p class="eyebrow">Bài thực hành Vue 3</p><h1>Giỏ hàng</h1><div v-if="cart.length"><dong-gio-hang v-for="item in cart" :key="item.id" :item="item" @doi-so-luong="changeQuantity" @yeu-cau-xoa="removeItem"></dong-gio-hang><div class="total"><span>Tổng số lượng: <b>{{ totalQuantity }}</b></span><strong>{{ money(totalPrice) }}</strong></div></div><div v-else class="empty">Giỏ hàng trống</div></section></main><script src="bai3.js"></script></body></html>
